# Blueprint do Render: cria a API + um PostgreSQL gerenciado.
# No painel do Render: New > Blueprint > aponte para este repositório.
services:
  - type: web
    name: rede-comunidade-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rede-comunidade-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_SENHA
        sync: false
      - key: ADMIN_CPF
        sync: false

databases:
  - name: rede-comunidade-db
    plan: free
    databaseName: rede_comunidade
